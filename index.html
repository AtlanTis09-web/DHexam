<body>

    <header>
        <button id="homeBtn" class="home-btn" onclick="location.reload()">🏠 메인</button>
        <h2 id="headerTitle">과목을 선택해주세요</h2>
        <div id="penToolBar" style="display: none; margin-top: 10px; justify-content: center; gap: 8px;">
            <button id="modeScrollBtn" class="tool-btn active" onclick="setMode('scroll')">🖐️ 이동</button>
            <button id="modePenBtn" class="tool-btn" onclick="setMode('pen')">✏️ 빨간펜</button>
            <button id="modeHighlighterBtn" class="tool-btn" onclick="setMode('highlighter')">🖍️ 형광펜</button>
            <button class="tool-btn" onclick="clearFullCanvas()" style="background-color: #e74c3c;">🧹 필기 지우기</button>
        </div>
    </header>

    <div id="selectionScreen" class="selection-container">
        <h3>풀이할 시험지를 선택하세요</h3>

        <div class="picker-step">
            <p class="picker-label">1. 학년</p>
            <div id="gradeChips" class="chip-group"></div>
        </div>

        <div class="picker-step">
            <p class="picker-label">2. 과목</p>
            <div id="subjectChips" class="chip-group chip-group-disabled"></div>
        </div>

        <div class="picker-step">
            <p class="picker-label">3. 시험</p>
            <div id="examList" class="exam-list"><p class="exam-list-empty">학년과 과목을 먼저 선택하세요</p></div>
        </div>

        <button class="primary-btn" id="startExamBtn" style="width: 100%; margin-top: 25px;" onclick="startExam()" disabled>시험 시작</button>
        <button class="secondary-btn" style="width: 100%; margin-top: 12px;" onclick="showWrongNoteHistory()">📕 전체 오답노트 보기</button>
    </div>

    <div class="quiz-container" id="quizContainer" style="display: none;">
        <div class="passage-area" id="passageArea" style="position: relative;">
            <canvas id="passageCanvas" class="overlay-canvas"></canvas>
            <div class="passage-content collapsed" id="passageContent"></div>
            <button class="toggle-btn" id="togglePassageBtn" onclick="togglePassage()">지문 펴기 ▼</button>
        </div>

        <div class="question-area" id="questionArea" style="position: relative;">
            <canvas id="questionCanvas" class="overlay-canvas"></canvas>
            
            <div id="questionTitle" class="q-title"></div>
            
            <div id="imageContainer" style="display:none; text-align:center; margin-bottom:15px; position:relative; z-index:11;">
                <img id="questionImage" src="" style="max-width:100%; border-radius:5px; border:1px solid #ddd;">
            </div>
            
            <div id="inlinePassageContainer"></div>
            
            <div id="optionsContainer" style="position:relative; z-index:11;"></div>

            <div id="subjectiveContainer" style="display:none; margin-bottom:20px; position:relative; z-index:11;">
                <p style="font-weight:bold; margin-bottom:10px;">정답 입력:</p>
                <input type="text" id="subjectiveInput" placeholder="답을 입력하고 엔터를 누르세요">
            </div>

            <div class="btn-group" style="position:relative; z-index:11; display: flex; justify-content: flex-end; align-items: center; margin-top: 20px; gap: 10px;">
                <button class="secondary-btn" id="prevBtn" onclick="goPrev()" style="flex: 1.5; padding: 14px 10px; display: none; background-color: #7f8c8d;">❮ 이전 문제</button>
                <button class="primary-btn" id="nextBtn" onclick="goNext()" style="flex: 2; padding: 14px 10px;">다음 문제 ❯</button>
            </div>
        </div>
    </div>

    <div class="result-container" id="resultContainer" style="display: none;">
        <div class="score-board">
            <h2>🎉 시험 종료!</h2>
            <h1 id="finalScoreText" style="font-size: 40px; margin-top: 10px;"></h1>
        </div>

        <div class="review-filter-bar">
            <button id="filterAllBtn" class="filter-btn filter-active" onclick="setReviewFilter('all')">전체 보기</button>
            <button id="filterWrongBtn" class="filter-btn" onclick="setReviewFilter('wrong')">❌ 오답만 보기</button>
        </div>

        <div id="reviewNotes"></div>
        <div style="text-align: center; margin-top: 30px;">
            <button class="primary-btn" onclick="location.reload()">메인으로 돌아가기 ↺</button>
        </div>
    </div>

    <div class="result-container" id="wrongNoteContainer" style="display: none; flex-direction: column; max-width: 900px;">
        <div class="score-board wrong-note-header">
            <h2>📕 누적 오답노트</h2>
            <div class="wrong-note-controls">
                <select id="wrongNoteSubjectFilter" onchange="renderWrongNoteHistory()"></select>
                <span id="wrongNoteCount"></span>
            </div>
        </div>
        <div id="wrongNoteList" style="margin-top:20px;"></div>
        <div style="text-align: center; margin-top: 30px; display:flex; gap:15px; justify-content:center; flex-wrap:wrap;">
            <button class="secondary-btn" onclick="backToSelectionFromWrongNote()">← 메인으로</button>
            <button class="secondary-btn" style="background-color:#e74c3c;" onclick="clearWrongHistory()">🗑️ 오답노트 전체 삭제</button>
        </div>
    </div>
